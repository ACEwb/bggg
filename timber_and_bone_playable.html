<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIMBER & BONE — Playable Prototype</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #101517;
      color: #eaf2ef;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 340px;
      min-height: 100vh;
    }
    .game { padding: 12px; }
    .panel {
      background: #162024;
      border-left: 1px solid #2b3a40;
      padding: 12px;
      overflow: auto;
    }
    canvas {
      width: min(100%, 960px);
      max-height: 68vh;
      aspect-ratio: 16/9;
      border: 1px solid #2b3a40;
      border-radius: 8px;
      background: linear-gradient(#1d3a40, #243827 55%, #1f2d1e);
      touch-action: manipulation;
    }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .card { background: #1a282d; border: 1px solid #30444b; padding: 8px; border-radius: 8px; }
    .card small { color: #90a4aa; display: block; }
    .actions { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; }
    button {
      background: #2a5a45;
      border: 1px solid #4e8d72;
      color: #eaf2ef;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button[disabled] { opacity: .45; cursor: not-allowed; }
    .upgrade { margin: 8px 0; background: #1a282d; border: 1px solid #30444b; border-radius: 8px; padding: 8px; }
    .upgrade h4 { margin: 0 0 4px; }
    .upgrade p { margin: 2px 0 8px; color: #a8babf; font-size: 13px; }
    .msg { font-size: 13px; color: #8fd3a5; min-height: 18px; }
    @media (max-width: 980px) {
      body { grid-template-columns: 1fr; }
      .panel { border-left: none; border-top: 1px solid #2b3a40; }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>TIMBER & BONE</h1>
    <canvas id="view" width="960" height="540" aria-label="forest"></canvas>

    <section class="hud">
      <div class="card"><small>Wood</small><strong id="wood">0</strong></div>
      <div class="card"><small>Total Wood</small><strong id="totalWood">0</strong></div>
      <div class="card"><small>Zone</small><strong id="zone">1</strong></div>
      <div class="card"><small>Tree HP</small><strong id="treeHp">0 / 0</strong></div>
      <div class="card"><small>Stamina</small><strong id="stamina">0 / 0</strong></div>
      <div class="card"><small>Wood/sec (est)</small><strong id="wps">0</strong></div>
    </section>

    <div class="actions">
      <button id="chop">Chop (Space / Tap Tree)</button>
      <button id="autosave">Save</button>
      <button id="wipe">Reset Save</button>
    </div>
    <div class="msg" id="msg"></div>
  </main>

  <aside class="panel">
    <h3>Infinite Tree-Cutting Upgrades</h3>
    <div id="upgrades"></div>
  </aside>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $("view");
    const ctx = canvas.getContext("2d");

    const state = {
      wood: 0,
      totalWood: 0,
      zone: 1,
      stamina: 25,
      staminaMax: 25,
      staminaRegen: 4,
      treeHp: 30,
      treeMaxHp: 30,
      autoTimer: 0,
      spawnTimer: 0,
      lastUpdate: performance.now(),
      levels: { power: 0, speed: 0, weak: 0, yield: 0, effort: 0, auto: 0, structure: 0 },
      treeX: 640,
      weakX: 0.5,
      treeAlive: true,
      message: "Cut your first tree.",
      lastSave: Date.now(),
      totalChops: 0
    };

    const upgrades = [
      { id: "power", name: "Axe Power", desc: "More damage per chop.", base: 12, growth: 1.18 },
      { id: "speed", name: "Swing Speed", desc: "Less delay between chops.", base: 18, growth: 1.2 },
      { id: "weak", name: "Weak Point", desc: "Larger crit zone and stronger crits.", base: 20, growth: 1.22 },
      { id: "yield", name: "Yield Multiplication", desc: "More wood per tree.", base: 16, growth: 1.19 },
      { id: "effort", name: "Effort Reduction", desc: "Lower stamina cost and more regen.", base: 22, growth: 1.21 },
      { id: "auto", name: "Auto-Cut", desc: "Trees get chopped automatically.", base: 35, growth: 1.26 },
      { id: "structure", name: "Structural Knowledge", desc: "Trees start partially broken.", base: 30, growth: 1.24 },
    ];

    function fmt(v) {
      if (v < 1000) return v.toFixed(v >= 100 ? 0 : 1).replace(/\.0$/, "");
      const names = ["K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
      let e = Math.floor(Math.log10(v) / 3);
      if (e <= names.length) return (v / 10 ** (e * 3)).toFixed(2) + names[e - 1];
      return v.toExponential(2);
    }

    function costOf(u) {
      const n = state.levels[u.id];
      return Math.floor(u.base * Math.pow(n + 1, 1.32) * Math.pow(u.growth, n));
    }

    function stats() {
      const speed = 1 + state.levels.speed * 0.11;
      const power = 5 + state.levels.power * 1.8;
      const weakSize = Math.min(0.1 + state.levels.weak * 0.01, 0.48);
      const weakMult = 1.4 + state.levels.weak * 0.07;
      const yieldMul = 1 + state.levels.yield * 0.22;
      const staminaCost = Math.max(0, 6 - state.levels.effort * 0.25);
      const regen = state.staminaRegen + state.levels.effort * 0.32;
      const autoRate = state.levels.auto <= 0 ? 0 : (0.22 * state.levels.auto * speed);
      const structuralCut = Math.min(0.65, state.levels.structure * 0.03);
      return { speed, power, weakSize, weakMult, yieldMul, staminaCost, regen, autoRate, structuralCut };
    }

    function treeMaxForZone(zone) {
      return 25 * Math.pow(zone, 1.42) + 6 * zone;
    }

    function spawnTree() {
      state.treeAlive = true;
      state.weakX = 0.18 + Math.random() * 0.64;
      state.treeMaxHp = treeMaxForZone(state.zone);
      state.treeHp = state.treeMaxHp * (1 - stats().structuralCut);
    }

    function canChop() {
      const s = stats();
      if (!state.treeAlive) return false;
      return state.stamina >= s.staminaCost || s.staminaCost <= 0;
    }

    function chop(isAuto = false) {
      const s = stats();
      if (!state.treeAlive) return;
      if (!isAuto && !canChop()) {
        state.message = "Too tired. Upgrade Effort Reduction.";
        return;
      }

      const hitX = Math.random();
      const weakHit = Math.abs(hitX - state.weakX) <= s.weakSize;
      const dmg = s.power * (weakHit ? s.weakMult : 1) * (1 + state.zone * 0.05);

      state.treeHp -= dmg;
      if (!isAuto) state.stamina = Math.max(0, state.stamina - s.staminaCost);
      state.totalChops += 1;

      if (state.treeHp <= 0) {
        state.treeAlive = false;
        const base = 6 * Math.pow(state.zone, 1.14);
        const payout = base * s.yieldMul * (1 + state.levels.structure * 0.08);
        state.wood += payout;
        state.totalWood += payout;
        state.spawnTimer = 0.25;

        if (state.totalWood > 5e5) state.message = "Reality splinters. Forests fear your name.";
        else if (state.totalWood > 5e4) state.message = "The axe swings itself now.";
        else if (state.totalWood > 5e3) state.message = "Ridiculous pace achieved.";
        else state.message = "TIMBER!";
      }
    }

    function unlockZones() {
      const z = Math.max(1, Math.floor(Math.pow(state.totalWood / 150, 0.34)) + 1);
      state.zone = z;
    }

    function render() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // Ground
      ctx.fillStyle = "#2a3e2a";
      ctx.fillRect(0, h * 0.75, w, h * 0.25);

      // Tree
      const trunkX = w * 0.66;
      const trunkW = 60;
      const trunkH = 220;
      const trunkTop = h * 0.75 - trunkH;
      const hpPct = Math.max(0, state.treeHp / state.treeMaxHp);
      const bark = Math.floor(80 + hpPct * 90);
      ctx.fillStyle = `rgb(${bark}, ${Math.floor(bark * 0.66)}, 40)`;
      if (state.treeAlive) ctx.fillRect(trunkX, trunkTop, trunkW, trunkH);

      // Canopy
      ctx.fillStyle = state.treeAlive ? "#3e7d48" : "#4e4e4e";
      ctx.beginPath();
      ctx.arc(trunkX + trunkW / 2, trunkTop - 30, 95, 0, Math.PI * 2);
      ctx.fill();

      // Weak point
      if (state.treeAlive) {
        const s = stats();
        const wx = trunkX + trunkW * state.weakX;
        const wy = trunkTop + trunkH * 0.55;
        ctx.fillStyle = "#ff9f43";
        ctx.beginPath();
        ctx.arc(wx, wy, 5 + s.weakSize * 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // HP bar
      ctx.fillStyle = "#222";
      ctx.fillRect(24, 20, 300, 20);
      ctx.fillStyle = "#46c16f";
      ctx.fillRect(24, 20, 300 * hpPct, 20);
      ctx.strokeStyle = "#90a4aa";
      ctx.strokeRect(24, 20, 300, 20);

      ctx.fillStyle = "#fff";
      ctx.font = "16px system-ui";
      ctx.fillText(`Zone ${state.zone} Forest`, 24, 68);
      ctx.fillText(state.treeAlive ? "Tap tree or press Space to chop" : "Tree down...", 24, 92);
    }

    function updateHud() {
      const s = stats();
      const estWps = (s.autoRate * (6 * Math.pow(state.zone, 1.14) * s.yieldMul)) / Math.max(1, state.treeMaxHp / (s.power * 1.2));
      $("wood").textContent = fmt(state.wood);
      $("totalWood").textContent = fmt(state.totalWood);
      $("zone").textContent = state.zone;
      $("treeHp").textContent = `${fmt(Math.max(0, state.treeHp))} / ${fmt(state.treeMaxHp)}`;
      $("stamina").textContent = `${fmt(state.stamina)} / ${fmt(state.staminaMax)}`;
      $("wps").textContent = fmt(Math.max(0, estWps));
      $("msg").textContent = state.message;
    }

    function renderUpgrades() {
      const wrap = $("upgrades");
      wrap.innerHTML = "";
      upgrades.forEach((u) => {
        const c = costOf(u);
        const level = state.levels[u.id];
        const box = document.createElement("div");
        box.className = "upgrade";
        box.innerHTML = `<h4>${u.name} Lv.${level}</h4><p>${u.desc}</p>`;
        const b = document.createElement("button");
        b.textContent = `Buy (${fmt(c)} wood)`;
        b.disabled = state.wood < c;
        b.onclick = () => {
          if (state.wood < c) return;
          state.wood -= c;
          state.levels[u.id] += 1;
          state.staminaMax = 25 + state.levels.effort * 1.2;
          state.message = `${u.name} improved.`;
          renderUpgrades();
        };
        box.appendChild(b);
        wrap.appendChild(box);
      });
    }

    function save() {
      localStorage.setItem("timberBoneSave", JSON.stringify({ ...state, lastSave: Date.now() }));
      state.message = "Saved.";
    }

    function load() {
      const raw = localStorage.getItem("timberBoneSave");
      if (!raw) return spawnTree();
      try {
        const data = JSON.parse(raw);
        Object.assign(state, data);
        const awaySec = Math.min(60 * 60 * 8, Math.max(0, (Date.now() - (data.lastSave || Date.now())) / 1000));
        const s = stats();
        if (s.autoRate > 0) {
          const offline = awaySec * s.autoRate * (6 * Math.pow(state.zone, 1.14)) * 0.07 * s.yieldMul;
          state.wood += offline;
          state.totalWood += offline;
          state.message = `Offline gain: ${fmt(offline)} wood.`;
        }
        spawnTree();
      } catch {
        spawnTree();
      }
    }

    function loop(t) {
      const dt = Math.min(0.05, (t - state.lastUpdate) / 1000);
      state.lastUpdate = t;
      const s = stats();

      state.stamina = Math.min(state.staminaMax, state.stamina + s.regen * dt);

      if (!state.treeAlive) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) spawnTree();
      }

      if (s.autoRate > 0 && state.treeAlive) {
        state.autoTimer += dt * s.autoRate;
        while (state.autoTimer >= 1) {
          chop(true);
          state.autoTimer -= 1;
          if (!state.treeAlive) break;
        }
      }

      unlockZones();
      render();
      updateHud();
      requestAnimationFrame(loop);
    }

    $("chop").onclick = () => chop(false);
    canvas.addEventListener("pointerdown", (e) => {
      const r = canvas.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * canvas.width;
      const y = ((e.clientY - r.top) / r.height) * canvas.height;
      const inTree = x > canvas.width * 0.6 && x < canvas.width * 0.78 && y > canvas.height * 0.3 && y < canvas.height * 0.78;
      if (inTree) chop(false);
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); chop(false); }
    });

    $("autosave").onclick = save;
    $("wipe").onclick = () => {
      localStorage.removeItem("timberBoneSave");
      location.reload();
    };
    setInterval(save, 20000);

    load();
    renderUpgrades();
    updateHud();
    requestAnimationFrame((t) => { state.lastUpdate = t; loop(t); });
  </script>
</body>
</html>
